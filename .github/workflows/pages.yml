name: Update data and deploy to GitHub Pages

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and build
        run: |
          npm ci
          npm run build
      - name: Fetch latest data from Artificial Analysis API
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: node scripts/fetch-data.mjs
      - name: Stage site files
        run: |
          mkdir -p _site/dist
          cp index.html _site/
          cp dist/main.js _site/dist/
          cp models.json _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
